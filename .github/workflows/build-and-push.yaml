name: Publish Docker Image

on:
  push:
    branches: [ main ]

env:
  TF_VERSION: "1.14"
  DOCKER_IMAGE_VERSION: "1.14-v2"
  IMAGE_NAME: "tf-toolkit"
  DOCKERHUB_USERNAME: "manojshrr"

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Echo Build Version
        run: echo "Building Terraform version ${DOCKER_IMAGE_VERSION}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build \
            --build-arg TF_VERSION=${TF_VERSION} \
            -t ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${DOCKER_IMAGE_VERSION} \
            -t ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest .

      - name: Push Image
        run: |
          docker push ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${DOCKER_IMAGE_VERSION}
          docker push ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest

      - name: Add Build Summary
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Terraform Version:** ${TF_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Version:** ${DOCKER_IMAGE_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Pushed:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${DOCKER_IMAGE_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Hub Link:**" >> $GITHUB_STEP_SUMMARY
          echo "https://hub.docker.com/r/${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> $GITHUB_STEP_SUMMARY

      - name: Create Release 🚀
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.DOCKER_IMAGE_VERSION }}"
          name: "Terraform Toolkit v${{ env.DOCKER_IMAGE_VERSION }}"
          body: |
            Docker image built and published.

            **Toolkit Version:** ${{ env.DOCKER_IMAGE_VERSION }}
            **Terraform Version:** ${{ env.TF_VERSION }}

            **Images:**
            - `${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}`
            - `${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest`

            **Docker Hub:**
            https://hub.docker.com/r/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Docker Hub README
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./README.md
